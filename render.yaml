# Render Blueprint: New > Blueprint > select this repo. Creates the Postgres database and the
# Docker web service, wires DATABASE_URL, and generates AUTH_SECRET. No secrets live in git.
databases:
  - name: seatres-db
    plan: free
    databaseName: seatres
    user: seatres

services:
  - type: web
    name: seat-reservation
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: seatres-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_DEV_TOKEN_ENDPOINT
        value: "true"
      - key: DB_POOL_SIZE
        value: "15"
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError -XX:TieredStopAtLevel=1 -Xss512k"
